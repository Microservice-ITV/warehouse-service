name: 🚀 Warehouse Service Production Deploy

on:
  push:
    branches:
      - master

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/warehouse-service

jobs:

  build-and-push:
    name: 🐳 Build & Push Image to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 🏗️ Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/node/Dockerfile.prod
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  deploy:
    name: 🚀 Deploy to VPS (Docker Hub Pull)
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: read

    steps:
      - name: 🚀 SSH Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          script: |

            set -e

            APP_DIR=/var/www/html/microservices/warehouse-service
            COMPOSE_FILE=docker-compose.prod.yml

            echo "🚀 Starting deployment..."

            ########################################################
            # 1. Prepare directory
            ########################################################
            mkdir -p $APP_DIR
            cd $APP_DIR

            ########################################################
            # 2. Download compose file from GitHub
            #    NOTE: GITHUB_TOKEN only grants read on THIS repo
            #    (warehouse-service) — never point this at another
            #    service's repository or it 404s.
            ########################################################
            echo "📄 Downloading ${COMPOSE_FILE}..."
            curl -sfL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -o ${COMPOSE_FILE} \
              https://raw.githubusercontent.com/Microservice-ITV/warehouse-service/master/${COMPOSE_FILE}

            ########################################################
            # 3. Generate .env from GitHub Secrets
            #    (compose interpolates ${...} from this file)
            ########################################################
            cat > .env << 'EOF'
            ${{ secrets.PROD_ENV }}
            EOF
            chmod 600 .env

            # Values that MUST match this workflow can never drift from
            # PROD_ENV: PORT (compose healthcheck/expose hardcode 5002) and
            # the full image path (compose interpolates
            # ${DOCKER_USERNAME}/${DOCKER_IMAGE}:${IMAGE_TAG}).
            awk -F= '!($1 ~ /^(PORT|IMAGE_TAG|DOCKER_IMAGE|DOCKER_USERNAME)$/)' .env > .env.tmp && mv .env.tmp .env
            {
              echo "PORT=5002"
              echo "IMAGE_TAG=latest"
              echo "DOCKER_IMAGE=warehouse-service"
              echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}"
            } >> .env

            # docker-compose.prod.yml declares `env_file: ./.env-prod`;
            # compose fails without it. Same content is fine for both roles.
            cp .env .env-prod

            ########################################################
            # 4. Docker login (for private images)
            ########################################################
            echo "${{ secrets.DOCKER_TOKEN }}" \
            | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            ########################################################
            # 5. Pull images from Docker Hub (NO BUILD)
            ########################################################
            docker compose -f ${COMPOSE_FILE} pull

            ########################################################
            # 6. Start / Update containers
            ########################################################
            docker compose -f ${COMPOSE_FILE} up -d --remove-orphans

            ########################################################
            # 7. Health check
            #    The app is NOT published on a host port, so probe it
            #    from inside the container network. Its route is
            #    GET /health (src/app.ts), served on 5002.
            ########################################################
            echo "⏳ Waiting for warehouse-service container healthcheck to report 'healthy'..."
            APP_CID=$(docker compose -f ${COMPOSE_FILE} ps -q warehouse-app)
            HEALTHY=0
            for i in $(seq 1 24); do
              sleep 5
              # The compose healthcheck (interval 30s, start_period 20s) only
              # reports 'healthy' if the node process STAYS up — unlike a one-off
              # exec probe, which can win a race against a crash-looping app.
              if [ "$(docker inspect --format '{{.State.Health.Status}}' "$APP_CID" 2>/dev/null)" = "healthy" ]; then
                HEALTHY=1
                break
              fi
            done

            docker ps

            if [ "${HEALTHY}" != "1" ]; then
              echo "❌ Service did not become healthy. Recent logs:"
              docker compose -f ${COMPOSE_FILE} logs --tail=100
              exit 1
            fi

            ########################################################
            # 8. Cleanup old images
            #    NOTE: image prune only. `docker system prune -f` is
            #    deliberately NOT used — the daemon on this VPS is
            #    shared by every service, and system prune would delete
            #    other services' stopped containers and build cache.
            ########################################################
            docker image prune -f

            echo "✅ Deployment successful!"
